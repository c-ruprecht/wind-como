<text x="25.1" y="628.2" text-anchor="start" fill="#8a6d3b" font-size="13" paint-order="stroke" stroke="#eef2ee" stroke-width="3.5"><tspan x="25.1" dy="0em" font-weight="600">PO PLAIN</tspan><tspan x="25.1" dy="1.25em" font-weight="400">heats up more slowly –</tspan><tspan x="25.1" dy="1.25em" font-weight="400">relatively higher pressure (H)</tspan></text>
