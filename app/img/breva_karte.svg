<text x="329.3" y="334.7" text-anchor="start" fill="#0b6e8a" font-size="13" paint-order="stroke" stroke="#eef2ee" stroke-width="3.5"><tspan x="329.3" dy="0em" font-weight="600">BREVA</tspan><tspan x="329.3" dy="1.25em" font-weight="400">air flows from the plain</tspan><tspan x="329.3" dy="1.25em" font-weight="400">over the lake into the valleys</tspan><tspan x="329.3" dy="1.25em" font-weight="400">≈ 12–20:00, peak 15–17:00</tspan></text>
<text x="17.9" y="494.3" text-anchor="start" fill="#8a6d3b" font-size="12" paint-order="stroke" stroke="#eef2ee" stroke-width="3.5"><tspan x="17.9" dy="0em" font-weight="600">PRESSURE GRADIENT plain → valley</tspan><tspan x="17.9" dy="1.25em" font-weight="400">Milan–Chiavenna on Breva days</tspan><tspan x="17.9" dy="1.25em" font-weight="400">≈ 0.7 hPa stronger, grows</tspan><tspan x="17.9" dy="1.25em" font-weight="400">from morning to afternoon</tspan></text>
<text x="225.5" y="113.3" text-anchor="start" fill="#6b7177" font-size="12" paint-order="stroke" stroke="#eef2ee" stroke-width="3.5"><tspan x="225.5" dy="0em" font-weight="600">NORTH FOEHN disrupts:</tspan><tspan x="225.5" dy="1.25em" font-weight="400">Zurich–Milan ≥ 4 hPa</tspan></text>
